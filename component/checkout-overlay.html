<div id="checkoutOverlay" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 d-none" style="z-index: 9999;">
    <div class="checkout-section d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="checkout-card p-5">
                        <div class="text-center mb-5">
                            <h1 class="checkout-title mb-3">Checkout</h1>
                            <p class="lead text-muted">Review your order and complete checkout</p>
                            <button id="backToCart" class="btn btn-outline-secondary mb-4">
                                <i class="bi bi-arrow-left me-2"></i>Back to Cart
                            </button>
                        </div>

                        <div class="row mb-5">
                            <div class="col-md-7">
                                <h4 class="mb-4">Order Summary</h4>
                                <div id="checkoutOrderItems"></div>
                                <div class="mt-4 p-3 bg-light rounded">
                                    <div class="d-flex justify-content-between">
                                        <span>Total:</span>
                                        <strong class="order-total fs-3" id="checkoutTotal">$0.00</strong>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <h4 class="mb-4">Delivery Details</h4>
                                <form id="checkoutForm">
                                    <div class="mb-3">
                                        <label for="checkoutName">Full Name</label>
                                        <input type="text" class="form-control form-control-lg" id="checkoutName" name="name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="checkoutEmail">Email</label>
                                        <input type="email" class="form-control form-control-lg" id="checkoutEmail" name="email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="checkoutPhone">Phone</label>
                                        <input type="tel" class="form-control form-control-lg" id="checkoutPhone" name="phone" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="checkoutAddress">Delivery Address</label>
                                        <textarea class="form-control form-control-lg" id="checkoutAddress" name="address" rows="3" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label>Cash on Delivery</label>
                                    </div>
                                    <button type="submit" class="btn order-btn w-100 fs-5 py-3">Place Order</button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
